<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E13" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RAILFOCUS" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<title>RAILFOCUS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#0A0E13;
    --panel:#121821;
    --panel-2:#1A222C;
    --line:#26313D;
    --text:#EAEEF2;
    --muted:#8B97A3;
    --amber:#E8A33D;
    --amber-dim:#8C6427;
    --teal:#4FB6A8;
    --red:#D9614F;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
    .globe-hint{ display:none; }
  }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:
      radial-gradient(ellipse 600px 300px at 50% -10%, rgba(232,163,61,0.08), transparent),
      var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .screen{ display:none; flex-direction:column; flex:1; padding-bottom:28px; animation:fadeIn .35s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 20px 8px 20px;
  }
  .brand{
    font-family:'Fraunces',serif; font-weight:600; font-size:20px; letter-spacing:0.5px;
    display:flex; align-items:center; gap:8px;
  }
  .brand .dot{ width:7px; height:7px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber); }
  .icon-btn{
    width:36px; height:36px; border-radius:10px; background:var(--panel);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:16px; cursor:pointer;
  }
  .icon-btn:active{ transform:scale(0.94); }
  .topbar-actions{ display:flex; gap:8px; }

  /* ---------- departure board (hero) ---------- */
  .board{
    margin:12px 20px 6px 20px;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .board:active{ transform:scale(0.99); }
  .board::before{
    content:"오늘의 추천 여행"; position:absolute; top:10px; right:14px;
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.5px;
    color:var(--amber); opacity:0.8;
  }
  .board-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:2px; margin-bottom:10px;}
  .flap-row{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .flap{
    font-family:'Fraunces',serif; font-weight:600; font-size:22px;
  }
  .flap.arrow{ color:var(--amber); font-family:'IBM Plex Mono',monospace; font-size:16px; }
  .board-meta{ margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }
  .board-meta b{ color:var(--teal); font-weight:500; }

  /* ---------- section label ---------- */
  .section-label{
    padding:18px 20px 8px 20px; font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:2px; color:var(--muted);
  }

  /* ---------- route list ---------- */
  .route-list{ padding:0 20px; display:flex; flex-direction:column; gap:10px; }
  .route-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
  }
  .route-card:active{ transform:scale(0.98); border-color:var(--amber-dim); }
  .route-title{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; }
  .route-sub{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-top:4px; }
  .route-train{
    font-size:10px; color:var(--teal); background:rgba(79,182,168,0.1);
    border:1px solid rgba(79,182,168,0.3); border-radius:20px; padding:3px 8px; white-space:nowrap;
  }

  /* ---------- stats strip ---------- */
  .stats-strip{
    margin:18px 20px 4px 20px; display:flex; background:var(--panel);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }
  .stat-cell{ flex:1; text-align:center; padding:12px 6px; border-right:1px solid var(--line); }
  .stat-cell:last-child{ border-right:none; }
  .stat-num{ font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--amber); font-weight:600; }
  .stat-cap{ font-size:10px; color:var(--muted); margin-top:2px; }

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    display:flex; margin:22px 20px 4px 20px; gap:8px;
  }
  .nav-pill{
    flex:1; text-align:center; padding:10px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); font-size:12px; color:var(--muted); cursor:pointer;
  }
  .nav-pill:active{ transform:scale(0.97); }

  /* ---------- generic header w/ back ---------- */
  .subheader{ display:flex; align-items:center; gap:12px; padding:20px 20px 4px 20px; }
  .subheader h2{ font-family:'Fraunces',serif; font-size:19px; margin:0; font-weight:600; }

  /* ---------- duration screen ---------- */
  .journey-summary{
    margin:16px 20px; padding:16px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius);
  }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; padding:4px 20px; }
  .chip{
    padding:10px 16px; border-radius:24px; border:1px solid var(--line); background:var(--panel);
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text); cursor:pointer;
  }
  .chip.active{ background:var(--amber); color:#1a1204; border-color:var(--amber); font-weight:600; }
  .custom-row{ display:flex; align-items:center; gap:10px; padding:14px 20px 4px 20px; }
  .custom-row input{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:14px;
  }
  .primary-btn{
    margin:20px; padding:16px; border-radius:var(--radius); border:none;
    background:var(--amber); color:#1a1204; font-weight:700; font-size:15px; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ opacity:0.4; }
  .ghost-btn{
    margin:0 20px 12px 20px; padding:14px; border-radius:var(--radius); border:1px solid var(--line);
    background:transparent; color:var(--muted); font-size:14px; cursor:pointer; font-family:'Inter',sans-serif;
  }

  /* ---------- focus screen — 3D globe ---------- */
  .globe-wrap{
    position:relative;
    width:100%;
    height:320px;
    background: radial-gradient(ellipse 120% 80% at 50% 120%, rgba(20,40,80,0.35), transparent 60%), #020408;
    overflow:hidden;
  }
  #globe-canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:grab;
  }
  #globe-canvas:active{ cursor:grabbing; }
  .globe-hint{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:2px;
    color:rgba(139,151,163,0.6); pointer-events:none; z-index:5;
  }
  .globe-vignette{
    position:absolute; inset:0; pointer-events:none; z-index:4;
    background:
      radial-gradient(ellipse 90% 70% at 50% 45%, transparent 40%, rgba(2,4,8,0.55) 100%),
      linear-gradient(180deg, transparent 55%, var(--bg) 100%);
  }
  .focus-body{ flex:1; display:flex; flex-direction:column; padding:20px; }
  .route-line-head{
    display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--muted); letter-spacing:1px;
  }
  .train-name{ text-align:center; font-family:'Fraunces',serif; font-size:15px; color:var(--teal); margin:6px 0 18px 0; }

  .timer-wrap{ text-align:center; margin:10px 0 20px 0; }
  .timer-digits{
    font-family:'IBM Plex Mono',monospace; font-size:56px; font-weight:600; letter-spacing:2px;
    color:var(--amber);
  }
  .timer-digits span{ display:inline-block; }
  .timer-caption{ font-size:11px; color:var(--muted); letter-spacing:3px; margin-top:4px; }

  .progress-track{
    height:4px; background:var(--panel-2); border-radius:4px; margin:6px 0 8px 0; overflow:hidden;
  }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--teal), var(--amber)); width:0%; transition:width 0.9s linear; }

  .next-station{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-top:10px;
  }
  .ns-label{ font-size:10px; color:var(--muted); letter-spacing:1.5px; }
  .ns-name{ font-family:'Fraunces',serif; font-size:17px; margin-top:2px; }
  .ns-dist{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--teal); text-align:right; }

  .focus-controls{ display:flex; gap:10px; margin-top:auto; padding-top:20px; }
  .focus-controls button{
    flex:1; padding:14px; border-radius:12px; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; font-weight:600;
  }
  .btn-pause{ background:var(--panel); color:var(--text); border:1px solid var(--line); }
  .btn-cancel{ background:transparent; color:var(--red); border:1px solid rgba(217,97,79,0.3); }

  .toast{
    position:absolute; left:50%; top:14px; transform:translateX(-50%) translateY(-20px);
    background:var(--panel-2); border:1px solid var(--amber-dim); color:var(--amber);
    padding:9px 16px; border-radius:30px; font-size:12px; font-family:'IBM Plex Mono',monospace;
    opacity:0; transition:all .4s ease; pointer-events:none; z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- arrival screen ---------- */
  .ticket{
    margin:18px 20px; background:var(--panel); border:1px dashed var(--line); border-radius:var(--radius);
    padding:22px 20px; position:relative;
  }
  .ticket-arrived{ text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal); letter-spacing:2px; margin-bottom:6px;}
  .ticket-city{ text-align:center; font-family:'Fraunces',serif; font-size:28px; font-weight:700; }
  .ticket-route{ text-align:center; color:var(--muted); font-size:13px; margin-top:4px; }
  .ticket-divider{ border-top:1px dashed var(--line); margin:18px 0; }
  .ticket-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .ticket-item .k{ font-size:10px; color:var(--muted); letter-spacing:1px; }
  .ticket-item .v{ font-family:'IBM Plex Mono',monospace; font-size:16px; color:var(--amber); margin-top:3px; }
  .visited-stations{ margin-top:16px; font-size:12px; color:var(--muted); line-height:1.7; }
  .visited-stations b{ color:var(--text); }

  /* ---------- history ---------- */
  .history-list{ padding:0 20px; display:flex; flex-direction:column; gap:10px; }
  .history-item{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
  }
  .hi-top{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }
  .hi-route{ font-family:'Fraunces',serif; font-size:15px; margin-top:4px; }
  .hi-meta{ font-size:11px; color:var(--muted); margin-top:4px; }
  .empty-state{ margin:40px 20px; text-align:center; color:var(--muted); font-size:13px; line-height:1.8; }

  /* ---------- profile ---------- */
  .profile-hero{ margin:16px 20px; text-align:center; }
  .profile-hero .big{ font-family:'Fraunces',serif; font-size:20px; }
  .profile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 20px; }
  .pg-cell{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .pg-num{ font-family:'IBM Plex Mono',monospace; font-size:20px; color:var(--amber); font-weight:600; }
  .pg-cap{ font-size:11px; color:var(--muted); margin-top:4px; }

  ::-webkit-scrollbar{ display:none; }

  /* ---------- country filter ---------- */
  .country-filter{ display:flex; flex-wrap:wrap; gap:6px; padding:0 20px 4px 20px; }
  .cf-chip{
    padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--panel);
    font-size:11px; color:var(--muted); cursor:pointer;
  }
  .cf-chip.active{ background:rgba(232,163,61,0.15); color:var(--amber); border-color:var(--amber-dim); }

  /* ---------- stats screen ---------- */
  .stats-hero{
    margin:16px 20px; padding:20px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); text-align:center;
  }
  .stats-hero .big-num{ font-family:'IBM Plex Mono',monospace; font-size:36px; color:var(--amber); font-weight:600; }
  .stats-chart{ margin:12px 20px; padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .bar-label{ font-size:11px; color:var(--muted); width:72px; flex-shrink:0; }
  .bar-track{ flex:1; height:6px; background:var(--panel-2); border-radius:3px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--teal); border-radius:3px; }

  /* ---------- roadmap ---------- */
  .roadmap{ padding:0 20px 20px 20px; display:flex; flex-direction:column; gap:10px; }
  .phase-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
  }
  .phase-card.current{ border-color:var(--amber-dim); }
  .phase-card.future{ opacity:0.55; }
  .phase-tag{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.5px; color:var(--teal); }
  .phase-tag.done{ color:var(--amber); }
  .phase-title{ font-family:'Fraunces',serif; font-size:15px; margin:4px 0 6px 0; }
  .phase-items{ font-size:12px; color:var(--muted); line-height:1.7; }

  .sound-toggle{
    position:absolute; top:10px; right:10px; z-index:40;
    padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--panel);
    font-size:11px; color:var(--muted); cursor:pointer;
  }
  .sound-toggle.on{ color:var(--teal); border-color:rgba(79,182,168,0.4); }
</style>
</head>
<body>
<div id="app">

  <!-- ============ HOME ============ -->
  <section class="screen active" id="screen-home">
    <div class="topbar">
      <div class="brand"><span class="dot"></span>RAILFOCUS</div>
      <div class="topbar-actions">
        <div class="icon-btn" onclick="goto('profile')">◎</div>
        <div class="icon-btn" onclick="goto('history')">☰</div>
      </div>
    </div>

    <div class="board" onclick="surpriseMe()">
      <div class="board-label">SURPRISE ME · 랜덤 여행</div>
      <div class="flap-row" id="surprise-flap">
        <span class="flap" id="surprise-from">TOKYO</span>
        <span class="flap arrow">→</span>
        <span class="flap" id="surprise-to">KYOTO</span>
      </div>
      <div class="board-meta">탭하면 오늘의 목적지로 바로 떠납니다 · <b id="surprise-dist">513 km</b></div>
    </div>

    <div class="section-label">국가별 노선</div>
    <div class="country-filter" id="country-filter"></div>

    <div class="section-label">인기 노선</div>
    <div class="route-list" id="route-list"></div>

    <div class="stats-strip" id="home-stats"></div>

    <div class="bottom-nav">
      <div class="nav-pill" onclick="goto('history')">여행 기록</div>
      <div class="nav-pill" onclick="goto('stats')">통계</div>
      <div class="nav-pill" onclick="goto('profile')">내 여정</div>
    </div>
  </section>

  <!-- ============ DURATION ============ -->
  <section class="screen" id="screen-duration">
    <div class="subheader">
      <div class="icon-btn" onclick="goto('home')">←</div>
      <h2>집중 시간 설정</h2>
    </div>

    <div class="journey-summary" id="duration-summary"></div>

    <div class="section-label">집중 시간</div>
    <div class="chips" id="duration-chips"></div>

    <div class="section-label">직접 입력 (분)</div>
    <div class="custom-row">
      <input type="number" id="custom-minutes" placeholder="예: 40" min="1" max="180" />
      <div class="chip" onclick="setCustomDuration()">적용</div>
    </div>

    <button class="primary-btn" id="depart-btn" onclick="startFocus()" disabled>🚄 출발</button>
  </section>

  <!-- ============ FOCUS ============ -->
  <section class="screen" id="screen-focus">
    <div class="globe-wrap" id="globe-wrap">
      <canvas id="globe-canvas"></canvas>
      <div class="globe-vignette"></div>
      <div class="globe-hint">DRAG TO ORBIT · EARTH WGS84</div>
      <button type="button" class="sound-toggle on" id="sound-toggle" onclick="toggleSound()">🔊 사운드</button>
      <div class="toast" id="station-toast"></div>
    </div>

    <div class="focus-body">
      <div class="route-line-head">
        <span id="focus-from"></span>
        <span id="focus-to"></span>
      </div>
      <div class="train-name" id="focus-train"></div>

      <div class="timer-wrap">
        <div class="timer-digits" id="timer-digits">25:00</div>
        <div class="timer-caption" id="timer-caption">집중하는 중</div>
      </div>

      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="route-line-head">
        <span id="dist-covered">0 km</span>
        <span id="dist-total">513 km</span>
      </div>

      <div class="next-station">
        <div>
          <div class="ns-label">다음 역</div>
          <div class="ns-name" id="next-station-name">Nagoya</div>
        </div>
        <div class="ns-dist" id="next-station-dist">183 km</div>
      </div>

      <div class="focus-controls">
        <button type="button" class="btn-pause" id="pause-btn" onclick="togglePause()">일시정지</button>
        <button type="button" class="btn-cancel" onclick="cancelFocus()">여행 취소</button>
      </div>
    </div>
  </section>

  <!-- ============ ARRIVAL ============ -->
  <section class="screen" id="screen-arrival">
    <div class="subheader"><h2>도착</h2></div>
    <div class="ticket" id="arrival-ticket"></div>
    <button class="primary-btn" onclick="goto('home')">새 여행 시작</button>
    <button class="ghost-btn" onclick="goto('history')">여행 기록 보기</button>
  </section>

  <!-- ============ HISTORY ============ -->
  <section class="screen" id="screen-history">
    <div class="subheader">
      <div class="icon-btn" onclick="goto('home')">←</div>
      <h2>여행 기록</h2>
    </div>
    <div class="history-list" id="history-list"></div>
  </section>

  <!-- ============ STATS ============ -->
  <section class="screen" id="screen-stats">
    <div class="subheader">
      <div class="icon-btn" onclick="goto('home')">←</div>
      <h2>통계</h2>
    </div>
    <div class="stats-hero" id="stats-hero"></div>
    <div class="stats-chart" id="stats-chart"></div>
    <div class="section-label">주간 집중</div>
    <div class="stats-chart" id="stats-weekly"></div>
  </section>

  <!-- ============ PROFILE ============ -->
  <section class="screen" id="screen-profile">
    <div class="subheader">
      <div class="icon-btn" onclick="goto('home')">←</div>
      <h2>YOUR JOURNEY</h2>
    </div>
    <div class="profile-hero" id="profile-hero"></div>
    <div class="profile-grid" id="profile-grid"></div>
    <div class="section-label">로드맵</div>
    <div class="roadmap" id="roadmap"></div>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   RAILFOCUS
   Phase 1 ✅  노선 선택, 집중 타이머, 지도, 도착 요약
   Phase 2 ✅  실제 철도 데이터, 사운드, 여행 기록, 통계
   Phase 3 🔜  업적, 컬렉션, 랜덤 여행, 국가별 여행
   Phase 4 🔜  창밖 풍경, 고급 애니메이션, 글로벌 철도 확장

/* ---------- storage (localStorage + Cursor storage fallback) ---------- */
async function loadJourneys(){
  try{
    if(window.storage){
      const res = await window.storage.get('journeys', false);
      state.journeys = res && res.value ? JSON.parse(res.value) : [];
      return;
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem('railfocus-journeys');
    state.journeys = raw ? JSON.parse(raw) : [];
  }catch(e){ state.journeys = []; }
}
async function saveJourneys(){
  const data = JSON.stringify(state.journeys);
  try{
    if(window.storage){ await window.storage.set('journeys', data, false); return; }
  }catch(e){}
  try{ localStorage.setItem('railfocus-journeys', data); }
  catch(e){ console.error('storage save failed', e); }
}

/* ---------- sound (Web Audio train ambient) ---------- */
let audioCtx = null, soundNodes = null;

function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

function startTrainSound(){
  if(!state.soundEnabled) return;
  stopTrainSound();
  ensureAudio();
  const ctx = audioCtx;
  const bufferSize = 2 * ctx.sampleRate;
  const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for(let i=0; i<bufferSize; i++) output[i] = Math.random()*2-1;

  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuffer;
  noise.loop = true;

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 280;

  const gain = ctx.createGain();
  gain.gain.value = 0.04;

  const rumble = ctx.createOscillator();
  rumble.type = 'sine';
  rumble.frequency.value = 58;
  const rumbleGain = ctx.createGain();
  rumbleGain.gain.value = 0.015;

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  rumble.connect(rumbleGain);
  rumbleGain.connect(ctx.destination);

  noise.start(); rumble.start();
  soundNodes = { noise, rumble, gain, rumbleGain };
}

function stopTrainSound(){
  if(!soundNodes) return;
  try{ soundNodes.noise.stop(); soundNodes.rumble.stop(); }catch(e){}
  soundNodes = null;
}

function toggleSound(){
  state.soundEnabled = !state.soundEnabled;
  const btn = document.getElementById('sound-toggle');
  btn.textContent = state.soundEnabled ? '🔊 사운드' : '🔇 음소거';
  btn.classList.toggle('on', state.soundEnabled);
  if(state.session && !state.session.paused){
    state.soundEnabled ? startTrainSound() : stopTrainSound();
  }
}

function getElapsedSec(s){
  if(!s) return 0;
  let pausedMs = s.totalPausedMs || 0;
  if(s.paused && s.pausedAt) pausedMs += Date.now() - s.pausedAt;
  return Math.max(0, (Date.now() - s.startedAt - pausedMs) / 1000);
}

/* ---------- 3D GLOBE ENGINE (Three.js · WGS84) ---------- */
const GLOBE = {
  R: 1,
  TEX: {
    day:   'https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/earth-blue-marble.jpg',
    bump:  'https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/earth-topology.png',
    spec:  'https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/earth-water.png',
    night: 'https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/earth-night.jpg',
    clouds:'https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/earth-clouds.png',
  },
  scene:null, camera:null, renderer:null, earthGroup:null,
  earth:null, clouds:null, atmosphere:null, stars:null,
  routeMesh:null, trainGroup:null, stationGroup:null,
  animId:null, paused:false, userOrbit:false,
  orbitYaw:0.4, orbitPitch:0.28, orbitDist:2.65,
  drag:{active:false, x:0, y:0},
  trainTarget:null, routeColor:'#E8A33D',
  camSmooth:new THREE.Vector3(), lookSmooth:new THREE.Vector3(),
};

function latLngToVec3(lat, lng, r){
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

function slerpSurface(v0, v1, t, r){
  const a = v0.clone().normalize();
  const b = v1.clone().normalize();
  const dot = THREE.MathUtils.clamp(a.dot(b), -1, 1);
  const theta = Math.acos(dot);
  if(theta < 0.0001) return a.multiplyScalar(r);
  const s = Math.sin(theta);
  return a.clone().multiplyScalar(Math.sin((1-t)*theta)/s)
    .add(b.clone().multiplyScalar(Math.sin(t*theta)/s)).normalize().multiplyScalar(r);
}

function buildRouteCurve(stations, r, steps){
  const pts = [];
  for(let i=0; i<stations.length-1; i++){
    const v0 = latLngToVec3(stations[i].lat, stations[i].lng, r);
    const v1 = latLngToVec3(stations[i+1].lat, stations[i+1].lng, r);
    for(let j=0; j<=steps; j++){
      pts.push(slerpSurface(v0, v1, j/steps, r));
    }
  }
  return pts;
}

function initGlobe(){
  const canvas = document.getElementById('globe-canvas');
  const wrap = document.getElementById('globe-wrap');
  if(GLOBE.renderer) return;

  GLOBE.scene = new THREE.Scene();
  GLOBE.camera = new THREE.PerspectiveCamera(42, 1, 0.01, 100);
  GLOBE.renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:'high-performance' });
  GLOBE.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  GLOBE.renderer.setClearColor(0x020408, 1);

  const loader = new THREE.TextureLoader();
  const dayTex = loader.load(GLOBE.TEX.day);
  const bumpTex = loader.load(GLOBE.TEX.bump);
  const specTex = loader.load(GLOBE.TEX.spec);
  const nightTex = loader.load(GLOBE.TEX.night);
  const cloudTex = loader.load(GLOBE.TEX.clouds);
  [dayTex, bumpTex, specTex, nightTex, cloudTex].forEach(t=>{
    t.anisotropy = GLOBE.renderer.capabilities.getMaxAnisotropy();
  });

  GLOBE.earthGroup = new THREE.Group();
  GLOBE.earthGroup.rotation.z = 23.439 * Math.PI / 180;
  GLOBE.scene.add(GLOBE.earthGroup);

  const earthGeo = new THREE.SphereGeometry(GLOBE.R, 96, 96);
  GLOBE.earth = new THREE.Mesh(earthGeo, new THREE.MeshPhongMaterial({
    map: dayTex,
    bumpMap: bumpTex,
    bumpScale: 0.018,
    specularMap: specTex,
    specular: new THREE.Color(0x333333),
    shininess: 12,
    emissiveMap: nightTex,
    emissive: new THREE.Color(0xffffff),
    emissiveIntensity: 0.55,
  }));
  GLOBE.earthGroup.add(GLOBE.earth);

  GLOBE.clouds = new THREE.Mesh(
    new THREE.SphereGeometry(GLOBE.R * 1.012, 80, 80),
    new THREE.MeshPhongMaterial({ map:cloudTex, transparent:true, opacity:0.22, depthWrite:false })
  );
  GLOBE.earthGroup.add(GLOBE.clouds);

  const atmoMat = new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vNorm;
      void main(){
        vNorm = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vNorm;
      void main(){
        float rim = pow(1.0 - max(dot(vNorm, vec3(0,0,1)), 0.0), 3.0);
        gl_FragColor = vec4(0.35, 0.65, 1.0, rim * 0.85);
      }`,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false,
  });
  GLOBE.atmosphere = new THREE.Mesh(new THREE.SphereGeometry(GLOBE.R * 1.08, 64, 64), atmoMat);
  GLOBE.earthGroup.add(GLOBE.atmosphere);

  const starCount = 2200;
  const starPos = new Float32Array(starCount * 3);
  for(let i=0; i<starCount; i++){
    const r = 18 + Math.random()*14;
    const t = Math.random()*Math.PI*2;
    const p = Math.acos(2*Math.random()-1);
    starPos[i*3]   = r * Math.sin(p) * Math.cos(t);
    starPos[i*3+1] = r * Math.cos(p);
    starPos[i*3+2] = r * Math.sin(p) * Math.sin(t);
  }
  GLOBE.stars = new THREE.Points(
    new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(starPos, 3)),
    new THREE.PointsMaterial({ color:0xffffff, size:0.035, transparent:true, opacity:0.75, sizeAttenuation:true })
  );
  GLOBE.scene.add(GLOBE.stars);

  const sun = new THREE.DirectionalLight(0xfff4e8, 1.35);
  sun.position.set(5, 2, 4);
  GLOBE.scene.add(sun);
  GLOBE.scene.add(new THREE.AmbientLight(0x1a2240, 0.55));
  GLOBE.scene.add(new THREE.HemisphereLight(0x4466aa, 0x080810, 0.35));

  GLOBE.routeMesh = new THREE.Group();
  GLOBE.stationGroup = new THREE.Group();
  GLOBE.trainGroup = new THREE.Group();
  GLOBE.earthGroup.add(GLOBE.routeMesh, GLOBE.stationGroup, GLOBE.trainGroup);

  GLOBE.trainTarget = latLngToVec3(35.68, 139.77, GLOBE.R * 1.006);
  GLOBE.camSmooth.copy(GLOBE.trainTarget.clone().normalize().multiplyScalar(GLOBE.orbitDist));
  GLOBE.lookSmooth.copy(GLOBE.trainTarget);

  canvas.addEventListener('pointerdown', e=>{
    GLOBE.drag.active = true;
    GLOBE.drag.x = e.clientX;
    GLOBE.drag.y = e.clientY;
    GLOBE.userOrbit = true;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e=>{
    if(!GLOBE.drag.active) return;
    const dx = (e.clientX - GLOBE.drag.x) * 0.005;
    const dy = (e.clientY - GLOBE.drag.y) * 0.005;
    GLOBE.drag.x = e.clientX;
    GLOBE.drag.y = e.clientY;
    GLOBE.orbitYaw -= dx;
    GLOBE.orbitPitch = THREE.MathUtils.clamp(GLOBE.orbitPitch + dy, -0.6, 0.9);
  });
  canvas.addEventListener('pointerup', ()=>{ GLOBE.drag.active = false; });
  canvas.addEventListener('wheel', e=>{
    e.preventDefault();
    GLOBE.orbitDist = THREE.MathUtils.clamp(GLOBE.orbitDist + e.deltaY * 0.0015, 1.85, 4.2);
    GLOBE.userOrbit = true;
  }, { passive:false });

  resizeGlobe();
  window.addEventListener('resize', resizeGlobe);
  animateGlobe();
}

function resizeGlobe(){
  const wrap = document.getElementById('globe-wrap');
  if(!wrap || !GLOBE.renderer) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  GLOBE.renderer.setSize(w, h, false);
  GLOBE.camera.aspect = w / h;
  GLOBE.camera.updateProjectionMatrix();
}

function setGlobeRoute(route){
  if(!GLOBE.renderer) initGlobe();
  GLOBE.routeColor = route.color;

  while(GLOBE.routeMesh.children.length) GLOBE.routeMesh.remove(GLOBE.routeMesh.children[0]);
  while(GLOBE.stationGroup.children.length) GLOBE.stationGroup.remove(GLOBE.stationGroup.children[0]);
  while(GLOBE.trainGroup.children.length) GLOBE.trainGroup.remove(GLOBE.trainGroup.children[0]);

  const r = GLOBE.R * 1.003;
  const curvePts = buildRouteCurve(route.stations, r, 48);
  const lineGeo = new THREE.BufferGeometry().setFromPoints(curvePts);
  const lineMat = new THREE.LineBasicMaterial({ color: route.color, transparent:true, opacity:0.95 });
  GLOBE.routeMesh.add(new THREE.Line(lineGeo, lineMat));

  const glowGeo = new THREE.BufferGeometry().setFromPoints(curvePts);
  const glowMat = new THREE.LineBasicMaterial({ color: route.color, transparent:true, opacity:0.25 });
  const glowLine = new THREE.Line(glowGeo, glowMat);
  glowLine.scale.setScalar(1.001);
  GLOBE.routeMesh.add(glowLine);

  route.stations.forEach((st, i)=>{
    const pos = latLngToVec3(st.lat, st.lng, GLOBE.R * 1.004);
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(i===0||i===route.stations.length-1 ? 0.014 : 0.008, 12, 12),
      new THREE.MeshBasicMaterial({ color: i===0||i===route.stations.length-1 ? 0xffffff : 0x8B97A3 })
    );
    dot.position.copy(pos);
    GLOBE.stationGroup.add(dot);
  });

  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.016, 20, 20),
    new THREE.MeshBasicMaterial({ color: route.color })
  );
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.028, 16, 16),
    new THREE.MeshBasicMaterial({ color: route.color, transparent:true, opacity:0.35 })
  );
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.022, 0.034, 32),
    new THREE.MeshBasicMaterial({ color: route.color, transparent:true, opacity:0.5, side:THREE.DoubleSide })
  );
  GLOBE.trainGroup.add(halo, ring, core);
  GLOBE.trainGroup.userData = { core, halo, ring };

  const first = route.stations[0];
  setGlobeTrain(first.lat, first.lng);
  GLOBE.userOrbit = false;
  frameGlobeToTrain(true);
}

function setGlobeTrain(lat, lng){
  if(!GLOBE.trainGroup) return;
  GLOBE.trainTarget = latLngToVec3(lat, lng, GLOBE.R * 1.006);
  GLOBE.trainGroup.position.copy(GLOBE.trainTarget);
  const up = GLOBE.trainTarget.clone().normalize();
  GLOBE.trainGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), up);
  const { ring } = GLOBE.trainGroup.userData;
  if(ring) ring.lookAt(GLOBE.camera ? GLOBE.camera.position : up);
}

function frameGlobeToTrain(instant){
  if(!GLOBE.trainTarget || !GLOBE.camera) return;
  const focus = GLOBE.trainTarget.clone();
  const camDir = new THREE.Vector3(
    Math.sin(GLOBE.orbitYaw) * Math.cos(GLOBE.orbitPitch),
    Math.sin(GLOBE.orbitPitch),
    Math.cos(GLOBE.orbitYaw) * Math.cos(GLOBE.orbitPitch)
  );
  const desired = focus.clone().add(camDir.multiplyScalar(GLOBE.orbitDist));
  if(instant){
    GLOBE.camSmooth.copy(desired);
    GLOBE.lookSmooth.copy(focus);
  }
}

function animateGlobe(){
  GLOBE.animId = requestAnimationFrame(animateGlobe);
  if(!GLOBE.renderer || !GLOBE.earthGroup) return;

  const t = performance.now() * 0.001;
  if(!GLOBE.paused){
    GLOBE.clouds.rotation.y += 0.00008;
    if(!GLOBE.userOrbit && !GLOBE.drag.active && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      GLOBE.orbitYaw += 0.0006;
    }
    if(GLOBE.trainGroup.userData){
      const { core, halo } = GLOBE.trainGroup.userData;
      const pulse = 1 + Math.sin(t * 4) * 0.12;
      halo.scale.setScalar(pulse);
      core.scale.setScalar(0.95 + Math.sin(t * 6) * 0.05);
    }
  }

  if(GLOBE.trainTarget){
    frameGlobeToTrain(false);
    GLOBE.camSmooth.lerp(
      GLOBE.trainTarget.clone().add(new THREE.Vector3(
        Math.sin(GLOBE.orbitYaw)*Math.cos(GLOBE.orbitPitch),
        Math.sin(GLOBE.orbitPitch),
        Math.cos(GLOBE.orbitYaw)*Math.cos(GLOBE.orbitPitch)
      ).multiplyScalar(GLOBE.orbitDist)),
      GLOBE.userOrbit ? 0.08 : 0.045
    );
    GLOBE.lookSmooth.lerp(GLOBE.trainTarget, GLOBE.userOrbit ? 0.1 : 0.06);
    GLOBE.camera.position.copy(GLOBE.camSmooth);
    GLOBE.camera.lookAt(GLOBE.lookSmooth);
  }

  GLOBE.renderer.render(GLOBE.scene, GLOBE.camera);
}

function setGlobePaused(p){ GLOBE.paused = p; }

function destroyGlobe(){
  if(GLOBE.animId) cancelAnimationFrame(GLOBE.animId);
  GLOBE.animId = null;
  if(GLOBE.renderer){ GLOBE.renderer.dispose(); GLOBE.renderer = null; }
  GLOBE.scene = null;
}

/* ---------- FOCUS screen ---------- */
function positionAlongRoute(route, km){
  const st = route.stations;
  for(let i=0;i<st.length-1;i++){
    if(km>=st[i].km && km<=st[i+1].km){
      const seg = st[i+1].km - st[i].km || 1;
      const t = (km - st[i].km)/seg;
      return {
        lat: lerp(st[i].lat, st[i+1].lat, t),
        lng: lerp(st[i].lng, st[i+1].lng, t),
        segIndex:i
      };
    }
  }
  return {lat:st[st.length-1].lat, lng:st[st.length-1].lng, segIndex:st.length-2};
}

function showToast(msg){
  const t = document.getElementById('station-toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function startFocus(){
  endSession();
  const route = state.selectedRoute;
  const durationSec = state.durationMin * 60;
  state.session = {
    route, durationSec,
    startedAt: Date.now(),
    pausedAt: null,
    totalPausedMs: 0,
    paused: false,
    visitedIdx: new Set([0]),
    finished: false,
  };

  document.getElementById('focus-from').textContent = route.stations[0].local;
  document.getElementById('focus-to').textContent = route.stations[route.stations.length-1].local;
  document.getElementById('focus-train').textContent = route.train;
  document.getElementById('dist-total').textContent = fmtKm(totalKm(route));
  document.getElementById('pause-btn').textContent = '일시정지';
  document.getElementById('timer-caption').textContent = '집중하는 중';
  document.getElementById('sound-toggle').textContent = state.soundEnabled ? '🔊 사운드' : '🔇 음소거';
  document.getElementById('sound-toggle').classList.toggle('on', state.soundEnabled);

  goto('focus');
  initGlobe();
  setGlobeRoute(route);
  setGlobePaused(false);
  setTimeout(resizeGlobe, 100);
  tickFocus();
  startFocusTimer();
  startTrainSound();
}

function tickFocus(){
  const s = state.session;
  if(!s || s.paused || s.finished) return;

  const elapsed = getElapsedSec(s);
  const remaining = Math.max(0, s.durationSec - elapsed);
  const fraction = Math.min(1, elapsed / s.durationSec);
  const km = fraction * totalKm(s.route);
  const pos = positionAlongRoute(s.route, km);
  setGlobeTrain(pos.lat, pos.lng);

  s.route.stations.forEach((st, idx)=>{
    if(km >= st.km && !s.visitedIdx.has(idx)){
      s.visitedIdx.add(idx);
      if(idx > 0) showToast('🚉 '+st.local+' 도착');
    }
  });

  const next = s.route.stations.find(st=>st.km > km) || s.route.stations[s.route.stations.length-1];
  document.getElementById('next-station-name').textContent = next.local;
  document.getElementById('next-station-dist').textContent = fmtKm(Math.max(0, next.km - km));

  document.getElementById('timer-digits').textContent = fmtClock(remaining);
  document.getElementById('progress-fill').style.width = (fraction*100).toFixed(1)+'%';
  document.getElementById('dist-covered').textContent = fmtKm(km);
  document.getElementById('timer-caption').textContent = remaining > 0 ? '집중하는 중' : '도착';

  if(remaining <= 0){
    s.finished = true;
    stopFocusTimer();
    stopTrainSound();
    setGlobePaused(true);
    finishFocus();
  }
}

function togglePause(){
  const s = state.session;
  if(!s || s.finished) return;

  if(s.paused){
    s.totalPausedMs += Date.now() - s.pausedAt;
    s.pausedAt = null;
    s.paused = false;
    document.getElementById('pause-btn').textContent = '일시정지';
    document.getElementById('timer-caption').textContent = '집중하는 중';
    startFocusTimer();
    setGlobePaused(false);
    if(state.soundEnabled) startTrainSound();
    tickFocus();
  } else {
    s.paused = true;
    s.pausedAt = Date.now();
    document.getElementById('pause-btn').textContent = '재개';
    document.getElementById('timer-caption').textContent = '일시정지됨';
    stopFocusTimer();
    stopTrainSound();
    setGlobePaused(true);
  }
}

function cancelFocus(){
  const s = state.session;
  if(!s) return;
  stopFocusTimer();
  if(!confirm('이 여행을 취소할까요? 진행 기록은 저장되지 않습니다.')){
    if(!s.paused) startFocusTimer();
    return;
  }
  endSession();
  goto('home');
}

async function finishFocus(){
  const s = state.session;
  if(!s) return;
  const route = s.route;
  const record = {
    date: new Date().toISOString(),
    routeId: route.id,
    from: route.stations[0].local,
    to: route.stations[route.stations.length-1].local,
    country: route.country,
    region: route.region,
    train: route.train,
    durationSec: s.durationSec,
    distanceKm: totalKm(route),
    stationsVisited: s.visitedIdx.size,
  };
  state.journeys.unshift(record);
  await saveJourneys();
  state.session = null;
  renderArrival(record);
  goto('arrival');
}

function renderArrival(record){
  const mins = Math.round(record.durationSec/60);
  document.getElementById('arrival-ticket').innerHTML = `
    <div class="ticket-arrived">🚉 여행 완료</div>
    <div class="ticket-city">${record.to}</div>
    <div class="ticket-route">${record.from} → ${record.to} · ${record.train}</div>
    <div class="ticket-divider"></div>
    <div class="ticket-grid">
      <div class="ticket-item"><div class="k">집중 시간</div><div class="v">${mins}분</div></div>
      <div class="ticket-item"><div class="k">이동 거리</div><div class="v">${fmtKm(record.distanceKm)}</div></div>
      <div class="ticket-item"><div class="k">정차역</div><div class="v">${record.stationsVisited}개</div></div>
      <div class="ticket-item"><div class="k">노선</div><div class="v" style="font-size:13px;">${record.country}</div></div>
    </div>
    <div class="visited-stations">여행 기록에 저장되었습니다. <b>${record.to}</b>가 방문 도시 목록에 추가됐어요.</div>
  `;
}

/* ---------- HISTORY ---------- */
function renderHistory(){
  const wrap = document.getElementById('history-list');
  if(state.journeys.length===0){
    wrap.innerHTML = '';
    document.getElementById('screen-history').insertAdjacentHTML('beforeend', '');
    wrap.parentElement.querySelectorAll('.empty-state').forEach(e=>e.remove());
    wrap.insertAdjacentHTML('afterend', '<div class="empty-state">아직 완료한 여행이 없습니다.<br>첫 집중 세션을 시작해보세요.</div>');
    return;
  }
  document.querySelectorAll('.empty-state').forEach(e=>e.remove());
  wrap.innerHTML = state.journeys.map(j=>{
    const d = new Date(j.date);
    const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    const mins = Math.round(j.durationSec/60);
    return `<div class="history-item">
      <div class="hi-top"><span>${dateStr}</span><span>${j.train}</span></div>
      <div class="hi-route">${j.from} → ${j.to}</div>
      <div class="hi-meta">${mins}분 집중 · ${fmtKm(j.distanceKm)} · 정차역 ${j.stationsVisited}개</div>
    </div>`;
  }).join('');
}

/* ---------- PROFILE / aggregate stats ---------- */
function aggregateStats(){
  const js = state.journeys;
  const totalKmSum = Math.round(js.reduce((a,j)=>a+j.distanceKm,0));
  const totalSec = js.reduce((a,j)=>a+j.durationSec,0);
  const countries = new Set(js.map(j=>j.country));
  const cities = new Set(js.flatMap(j=>[j.from,j.to]));
  const routesDone = new Set(js.map(j=>j.routeId));

  // streak: consecutive distinct calendar days ending today
  const days = [...new Set(js.map(j=>{
    const d=new Date(j.date); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }))];
  const dayDates = days.map(s=>{
    const [y,m,dd]=s.split('-').map(Number); return new Date(y,m,dd);
  }).sort((a,b)=>b-a);
  let streak=0;
  if(dayDates.length){
    let cursor = new Date(); cursor.setHours(0,0,0,0);
    for(const d of dayDates){
      const diff = Math.round((cursor-d)/86400000);
      if(diff===0 || diff===streak){ streak++; cursor=d; }
      else break;
    }
  }
  return { totalKm:totalKmSum, totalSec, sessions:js.length, hours:(totalSec/3600).toFixed(1), countries:countries.size, cities:cities.size, routes:routesDone.size, streak };
}

function renderProfile(){
  const agg = aggregateStats();
  document.getElementById('profile-hero').innerHTML = `
    <div class="big">지금까지 <b style="color:var(--amber)">${agg.totalKm.toLocaleString('ko-KR')}km</b>를 집중하며 이동했어요</div>
  `;
  document.getElementById('profile-grid').innerHTML = `
    <div class="pg-cell"><div class="pg-num">${agg.countries}</div><div class="pg-cap">🌍 방문 국가</div></div>
    <div class="pg-cell"><div class="pg-num">${agg.cities}</div><div class="pg-cap">🚉 방문 도시</div></div>
    <div class="pg-cell"><div class="pg-num">${agg.routes}</div><div class="pg-cap">🚆 완료 노선</div></div>
    <div class="pg-cell"><div class="pg-num">${agg.totalKm.toLocaleString('ko-KR')}</div><div class="pg-cap">📍 총 이동거리(km)</div></div>
    <div class="pg-cell"><div class="pg-num">${agg.hours}</div><div class="pg-cap">⏱ 총 집중시간(h)</div></div>
    <div class="pg-cell"><div class="pg-num">${agg.streak}</div><div class="pg-cap">🔥 연속 집중일</div></div>
  `;
  document.getElementById('roadmap').innerHTML = PHASES.map(p => `
    <div class="phase-card ${p.status}">
      <div class="phase-tag ${p.status==='done'?'done':''}">PHASE ${p.id} ${p.status==='done'?'✅':p.status==='current'?'진행 중':'예정'}</div>
      <div class="phase-title">${p.title}</div>
      <div class="phase-items">${p.items.join(' · ')}</div>
    </div>
  `).join('');
}

/* ---------- STATS screen ---------- */
function renderStats(){
  const agg = aggregateStats();
  const avgMin = agg.sessions ? Math.round(agg.totalSec / agg.sessions / 60) : 0;

  document.getElementById('stats-hero').innerHTML = `
    <div class="big-num">${agg.hours}h</div>
    <div style="font-size:13px;color:var(--muted);margin-top:6px;">총 집중 시간 · 평균 ${avgMin}분/여행</div>
  `;

  const byCountry = {};
  state.journeys.forEach(j => {
    byCountry[j.country] = (byCountry[j.country]||0) + j.durationSec;
  });
  const maxSec = Math.max(...Object.values(byCountry), 1);
  document.getElementById('stats-chart').innerHTML = Object.keys(byCountry).length
    ? Object.entries(byCountry).sort((a,b)=>b[1]-a[1]).map(([c, sec]) => `
      <div class="bar-row">
        <div class="bar-label">${c}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(sec/maxSec*100).toFixed(0)}%"></div></div>
        <div style="font-size:11px;color:var(--muted);width:40px;text-align:right;">${Math.round(sec/60)}분</div>
      </div>`).join('')
    : '<div style="color:var(--muted);font-size:13px;text-align:center;">아직 데이터가 없습니다</div>';

  const weekDays = ['일','월','화','수','목','금','토'];
  const weekData = Array(7).fill(0);
  const today = new Date();
  for(let i=0; i<7; i++){
    const d = new Date(today);
    d.setDate(d.getDate() - (6-i));
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    state.journeys.forEach(j=>{
      const jd = new Date(j.date);
      const jkey = `${jd.getFullYear()}-${jd.getMonth()}-${jd.getDate()}`;
      if(jkey === key) weekData[i] += j.durationSec;
    });
  }
  const maxWeek = Math.max(...weekData, 1);
  document.getElementById('stats-weekly').innerHTML = weekData.map((sec, i)=>{
    const d = new Date(today);
    d.setDate(d.getDate() - (6-i));
    return `<div class="bar-row">
      <div class="bar-label">${weekDays[d.getDay()]}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(sec/maxWeek*100).toFixed(0)}%;background:var(--amber)"></div></div>
      <div style="font-size:11px;color:var(--muted);width:40px;text-align:right;">${Math.round(sec/60)}분</div>
    </div>`;
  }).join('');
}

(async function init(){
  await loadJourneys();
  renderHome();
  window.addEventListener('beforeunload', endSession);
})();
